[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iwannaberich"
version = "2.0.0"
description = "Suite cuantitativa de análisis bursátil, filtrado estocástico y escaneo de señales para la Bolsa de Santiago (.SN)."
readme = "README.md"
authors = [
    { name = "Fernando Palma", email = "fernando.palma.b@ug.uchile.cl" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "matplotlib>=3.5.0",
    "pyarrow>=10.0.0",
]

[project.optional-dependencies]
download = [
    "yfinance>=0.2.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
iwannaberich = "iwannaberich.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["iwannaberich*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v"
